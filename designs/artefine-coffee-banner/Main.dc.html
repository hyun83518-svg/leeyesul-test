<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,900&family=Montserrat:wght@300&display=swap">
  <style>
    body { margin: 0; background: #15110f; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
    a { color: #ff6a2b; } a:hover { color: #ffa27a; }
  </style>
</helmet>
<div style="width: 1204px; height: 3604px; box-sizing: border-box; background: #15110f; color: #f3ead9; display: flex; flex-direction: column; justify-content: space-between; padding: 130px 96px 120px 96px; position: relative; overflow: hidden;">

  <div style="display: flex; align-items: baseline; gap: 34px;">
    <span style="font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 900; font-size: 128px; line-height: 1; color: #f3ead9;">arte</span>
    <span style="font-family: 'Montserrat', 'Noto Sans KR', system-ui, sans-serif; font-weight: 300; font-size: 80px; letter-spacing: 0.24em; line-height: 1; color: #f3ead9;">FINE</span>
    <span style="font-family: 'Noto Sans KR', system-ui, sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 0.34em; line-height: 1; color: #9d917f; margin-left: 12px;">LOUNGE</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0px;">
    <div style="font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 900px; line-height: 0.88; letter-spacing: -0.02em; color: #f3ead9;">커</div>
    <div style="font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 900px; line-height: 0.88; letter-spacing: -0.02em; color: #f3ead9;">피</div>
    <div style="font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; font-weight: 400; font-size: 250px; line-height: 1; letter-spacing: 0.04em; color: #ff6a2b; margin-top: 36px;">COFFEE</div>
  </div>

  <div style="background: #ff6a2b; color: #15110f; padding: 60px 64px; display: flex; align-items: center; justify-content: space-between; gap: 40px;">
    <div style="font-family: 'Noto Sans KR', system-ui, sans-serif; font-weight: 900; font-size: 124px; line-height: 1.05; letter-spacing: -0.02em;">이 안쪽에<br>있어요</div>
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" stroke="#15110f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; transform: {{arrowTransform}};"><path d="M28 100H166"></path><path d="M112 44L168 100L112 156"></path></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 26px;">
    <div style="font-family: 'Noto Sans KR', system-ui, sans-serif; font-weight: 700; font-size: 64px; line-height: 1.2; color: #f3ead9;">아메리카노 · 바스크 치즈케이크</div>
    <div style="font-family: 'Noto Sans KR', system-ui, sans-serif; font-weight: 400; font-size: 42px; line-height: 1.3; color: #9d917f;">디카페인 무료 변경 · 넓은 라운지 · 바이크 렌탈</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"arrow":{"editor":"enum","options":["right","left","up"],"default":"left","section":"화살표 방향"}}'>
class Component extends DCLogic {
  renderVals() {
    const dir = this.props.arrow ?? 'right';
    const rot = dir === 'left' ? 180 : dir === 'up' ? -90 : 0;
    return { arrowTransform: 'rotate(' + rot + 'deg)' };
  }
}
</script>
</body>
</html>
